name: Trigger Quartz Build

on:
  push:
    branches:
      - main # (ou 'master' selon le nom de votre branche principale)

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Quartz Workflow
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.QUARTZ_TRIGGER_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/ColinLath/DnD-Dragonlance-QuartzSite/dispatches \
            -d '{"event_type": "obsidian_updated"}'